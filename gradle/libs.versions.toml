[versions]
paper-api = "26.2.build.+"
minecraft = "26.2"
pl3xmap = "26.2-554"

# Supplied at runtime by Paper's library loader; keep in step with plugin.yml.
hikari = "7.0.2"
mariadb = "3.5.10"
caffeine = "3.2.3"

paperweight-userdev = "2.0.0-beta.23"
shadow = "9.6.1"
run-task = "3.0.2"

[libraries]
pl3xmap = { module = "maven.modrinth:pl3xmap", version.ref = "pl3xmap" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

[plugins]
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight-userdev" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }
