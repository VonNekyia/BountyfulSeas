# BountyfulSeas

water-map:
  # Path to the water-analyzer executable.
  #
  # Normally leave this empty. A copy is bundled in the plugin and unpacked to
  # plugins/BountyfulSeas/bin on first use, so nothing has to be installed.
  #
  # The bundled copy is a native binary and is built for one platform only - the
  # one the jar was built on. Set a path here when running somewhere else, or to
  # point at a newer build than the one shipped:
  #
  #   analyzer: "/opt/water-analyzer"
  analyzer: ""

  # Rescan the world every time the server starts, so the map keeps up as the
  # world grows. The scan runs in the background once the server is up, so it
  # never delays startup; the overlay is redrawn when it finishes. Turn this off
  # if scanning a very large world on every restart is not worth the CPU.
  regenerate-on-start: true

  # Extra flags passed to the analyzer. --world and --output are always supplied.
  arguments:
    - "--max-below-sea-level"
    - "10"
    - "--min-water-body"
    - "20"

# Catch statistics. Without a database the plugin still works, it just keeps no
# totals and the guide stays empty.
database:
  enabled: false
  host: "127.0.0.1"
  port: 13306
  name: "bountyfulseas"
  username: "minecraft"
  password: "minecraft"

  # How long server-wide totals and rankings may be served from memory. Per-player
  # figures ignore this: they are dropped the moment that player catches something.
  cache-seconds: 60

# Swarming fish. A fish with the swarm modifier gathers in a few water regions at
# a time and moves on, so it can only be caught where its swarm currently is.
# Swarming regions are drawn gold on the web map.
swarms:
  # How many swarms exist at once, across every swarming fish. Each takes a
  # region of its own, so more swarms than regions simply means fewer swarms.
  count: 3

  # How long a swarm stays put, in minutes.
  rotate-minutes: 60

# How likely each tier is when something bites. The tier is drawn first, then an
# entry from within it by spawn_weight - so the odds of a legendary do not change
# just because a spot happens to hold three of them.
#
# These are weights. The base set adds up to 100, and what an enchantment adds to
# a better tier is taken back out of uncommon, so it stays adding up. Only the
# tiers actually present at a spot take part in the draw.
#
# misc is junk and treasure is loot; both are tiers rather than fish and carry no
# length. signature is reserved for hand-placed fish and is never rolled by
# default - give it a weight above 0 to put it in the draw.
rarity-chances:
  uncommon: 75      # the buffer: everything the enchantments add comes out of here
  rare: 15
  misc: 5           # junk, and no enchantment lifts it
  epic: 4
  legendary: 0.5
  treasure: 0.5     # enchanted books and the like, lifted by Luck of the Sea
  mythic: 0.05      # outside the hundred on purpose, and never lifted
  signature: 0      # hand-placed only

# What a rod's enchantments are worth. Each adds a percentage of the tier's BASE
# weight per level, and everything added is taken out of uncommon - so the total
# stays where it started and the two enchantments never touch each other's tiers.
#
#   Luck of the Fish V:  rare 15 -> 22.5, epic 4 -> 6, legendary 0.5 -> 0.75
#                        uncommon 75 -> 65.25, misc and treasure untouched
#   Luck of the Sea V:   treasure 0.5 -> 0.75, uncommon 75 -> 74.75
#
# Both apply in full on a rod carrying both.
enchantments:
  luck-of-the-fish:
    # Raises rare, epic and legendary only. Not misc, not treasure - and not
    # mythic, so that no enchantment can make the rarest catch ordinary.
    # Levels I to V, so +50% of base at full.
    bonus-per-level: 10

    # The enchantment's registry key. It is not a vanilla enchantment, so a
    # datapack has to define it: one is written to plugins/BountyfulSeas/datapack,
    # ready to be copied into <world>/datapacks. Until something defines this key
    # the lookup finds nothing and the bonus is simply never applied.
    key: "bountyfulseas:luck_of_the_fish"

  luck-of-the-sea:
    # Treasure, and only treasure - that is where the enchanted books are.
    bonus-per-level: 10

  lure:
    # Off by default, so Lure keeps its vanilla job of making fish bite sooner.
    # Set above 0 to have it raise the same tiers as Luck of the Fish; the two
    # multiply rather than one replacing the other.
    bonus-per-level: 0
