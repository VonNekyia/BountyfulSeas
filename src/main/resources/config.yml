# BountyfulSeas

water-map:
  # Path to the water-analyzer executable.
  #
  # Normally leave this empty. The plugin carries one build per platform and
  # unpacks the one for this machine to plugins/BountyfulSeas/bin/<os>-<arch>
  # on first use, so nothing has to be installed.
  #
  # Shipped today: windows-x86_64 and linux-x86_64 (static, so any distribution).
  # Set a path here on anything else - an ARM server, a Mac - or to point at a
  # newer build than the one shipped:
  #
  #   analyzer: "/opt/water-analyzer"
  analyzer: ""

  # Rescan the world every time the server starts, so the map keeps up as the
  # world grows. The scan runs in the background once the server is up, so it
  # never delays startup; the overlay is redrawn when it finishes. Turn this off
  # if scanning a very large world on every restart is not worth the CPU.
  regenerate-on-start: true

  # Extra flags passed to the analyzer. --world and --output are always supplied.
  # Empty uses the tuned generator defaults: 2,000-column surface bodies,
  # 4,000-column cave pools, 20,000-column river merging, 10,000-column sea
  # merging, unrestricted cave detection, and ICE only at 50% real ice cover.
  arguments: []

# Catch statistics. Without a database the plugin still works, it just keeps no
# totals and the guide stays empty.
database:
  enabled: false
  host: "127.0.0.1"
  port: 13306
  name: "bountyfulseas"
  username: "minecraft"
  password: "minecraft"

  # How long server-wide totals and rankings may be served from memory. Per-player
  # figures ignore this: they are dropped the moment that player catches something.
  cache-seconds: 60

# Swarming fish. A fish with the swarm modifier gathers in a few water regions at
# a time and moves on, so it can only be caught where its swarm currently is.
# Swarming regions are drawn gold on the web map.
swarms:
  # How many swarms exist at once, across every swarming fish. Each takes a
  # region of its own, so more swarms than regions simply means fewer swarms.
  count: 3

  # How long a swarm stays put, in minutes.
  rotate-minutes: 60

# How long a caught fish turns out to be.
#
# A fish definition gives one number, max_length - the most that fish ever
# reaches. Everything below it is rolled from this curve, which is the shape
# fisheries science uses for a real stock (Beverton and Holt): fish die off
# steadily while their growth slows towards a ceiling, so most of what is
# swimming is middling and only a few live long enough to get big.
#
#   P(longer than l) = ((max - l) / (max - smallest)) ^ shape
#
# With the defaults below, for a fish that reaches 100 cm:
#
#   half of all catches are under 41 cm
#   4 in 100 are 75 cm or more
#   3 in 1000 are 90 cm or more
#   1 in 1000000 is the full 100 cm
sizes:
  # Z/K, the mortality-to-growth ratio: how many fish die for every bit of
  # growing the survivors do. Real stocks sit around 1.5 to 3. Raise it and big
  # ones get rarer; lower it and the catch evens out.
  shape: 3

  # The shortest a catch can be, as a fraction of that fish's maximum. This is
  # what min_length used to be, except it is one rule for every fish: a hook does
  # not bring up fry, which is the same reason the formula starts here.
  smallest: 0.25

  # One catch in this many comes up at exactly the maximum length. That is the
  # record - the number in the fish file is not where the fish stop growing, it
  # is the length hardly anyone ever sees. Lengths are truncated to two decimals
  # rather than rounded, so a catch reads as the maximum only when it reached it.
  record-odds: 1000000

  # The marks along the curve worth naming, used by /bs debug lengthvalue to say
  # what a length amounts to. A label and the fraction of catches that reach it;
  # write as many or as few as you like, in any order.
  brackets:
    - label: "a record"
      chance: 0.000001
    - label: "1 in 100000"
      chance: 0.00001
    - label: "1 in 10000"
      chance: 0.0001
    - label: "1 in 1000"
      chance: 0.001
    - label: "top 1%"
      chance: 0.01
    - label: "top 10%"
      chance: 0.10
    - label: "above average"
      chance: 0.50

# The angling level.
#
# Every fish carries a level in its definition and does not bite until the angler
# has reached it - it is not simply rarer, it is not in the draw at all. Levels
# come from milestones: each one a fish passes is worth
#
#   experience = experience-per-step  x  which milestone it is (1 to 10)
#                                     x  that fish's level
#
# so a fish's tenth milestone pays ten times its first, and a hard fish pays
# better than an easy one. Nothing is stored: the experience is worked out from
# the catch counts, so it can never drift away from them.
#
# Without a database there are no counts, so there is no level either - the gate
# then stands open rather than locking every fish away forever.
levels:
  # Experience for the first milestone of any fish. The steps are flat multiples of
  # it, so with 10 a fish pays 10, 20, 30 and so on up to 100 for its tenth.
  experience-per-step: 10

  # What a level costs is not set here. Each anchor below prices one level off the
  # roster: completed-at-milestone is how deep into every fish already open you are
  # expected to be, and completion is how much of that depth counts. A whole
  # completion at milestone four means the level costs what milestone four on every
  # open fish is worth - spent wherever the player likes, so it is a budget rather
  # than a checklist.
  #
  # Adding a fish therefore raises every anchor above it by itself, and the last
  # level is simply the highest one any fish is locked behind.
  #
  # The anchors below put the scale at roughly one milestone per few levels:
  # milestone one by level 2, two by level 3, three by level 5, four by level 6 and
  # five by level 11. The levels between them are interpolated - each step a little
  # larger than the one before - rather than priced the same way, so the climb does
  # not jump about with wherever the fish happen to land.
  #
  # The shares are not round numbers because they are what it takes to hold that
  # scale while every level still costs more than the one below it. Those two wants
  # pull against each other: the roster grows faster between levels 6 and 11 than the
  # milestones do, so asking for exactly milestone four at six and exactly five at
  # eleven would make the levels in between cost less each time.
  #
  # Milestones are paid flat but cost exponentially, so the milestone is the number
  # that decides whether the curve is playable: the second is 5 catches, the third
  # 10, the fourth 20, the fifth 50 and the tenth a thousand.
  anchors:
    - level: 3
      completed-at-milestone: 2
      completion: 0.50
    - level: 5
      completed-at-milestone: 3
      completion: 1.00
    # Not a whole milestone four. At 1.00 this level alone would cost three times the
    # one before it, and the next four would then cost less than it did - the climb
    # has to keep climbing.
    - level: 6
      completed-at-milestone: 4
      completion: 0.80
    - level: 11
      completed-at-milestone: 5
      completion: 1.00
    # Past five on purpose: the roster keeps growing up here, so holding the depth at
    # five would make the last levels cost less than level eleven did.
    - level: 15
      completed-at-milestone: 6
      completion: 0.85

# The two sides of the table.
#
# A fish tier holds things that were swimming and carry a length. An object tier
# holds what the line brings up instead - junk, or a chest's worth of enchanted
# books - and those carry no length at all: no max_length in the definition, no
# measurement in chat, no record to beat.
#
# This split is also what the two luck enchantments are worked out from, so it is
# worth getting right. On each side, the tier with the HIGHEST chance is the one
# that pays for the enchantment rather than gaining from it, and the tier with the
# LOWEST chance is the one that gains and never pays. Everything in between does
# both. With the chances below that makes uncommon and misc the payers, and
# legendary and treasure the two that survive any amount of enchanting.
#
# A tier at chance 0 is out of it entirely - neither lifted nor spent.
tiers:
  fish: [common, uncommon, rare, epic, legendary, mythic, signature]
  objects: [misc, treasure]

# How likely each tier is when something bites. The tier is drawn first, then an
# entry from within it by spawn_weight - so the odds of a legendary do not change
# just because a spot happens to hold three of them.
#
# These are weights. The base set adds up to 100, so the numbers read as
# percentages, and what an enchantment adds to a better tier is taken back out of
# the tiers below - common first, then uncommon, then rare, then misc, then epic,
# each emptied before the next is touched.
#
# A tier with nothing to offer at a spot hands its share to misc rather than to the
# other tiers: water with no rare fish in it gives up a boot where the rare would
# have been, instead of quietly making every other fish there likelier. Where there
# is no junk at the spot either, the share is not drawn at all.
#
# misc is junk and treasure is loot; both are tiers rather than fish and carry no
# length. signature is reserved for hand-placed fish and is never rolled by
# default - give it a weight above 0 to put it in the draw.
rarity-chances:
  common: 40        # spent first: everything the enchantments add comes out of here
  uncommon: 35      # spent second
  rare: 15          # lifted by Luck of the Fish, and spent once uncommon is empty
  epic: 5           # lifted by Luck of the Fish, spent last
  legendary: 0.5    # never spent: the top of the fish side
  misc: 4           # junk, lifted by nothing, and the stand-in for absent tiers
  treasure: 0.5     # enchanted books and the like, lifted by Luck of the Sea, never spent
  mythic: 0         # off for now; nothing lifts it and nothing spends it
  signature: 0      # hand-placed only

# What a rod's enchantments are worth. Each adds a percentage of the tier's BASE
# weight per level, and everything added is taken out of uncommon - so the total
# stays where it started and the two enchantments never touch each other's tiers.
#
#   Luck of the Fish V:  rare 15 -> 22.5, epic 4 -> 6, legendary 0.5 -> 0.75
#                        uncommon 75 -> 65.25, misc and treasure untouched
#   Luck of the Sea V:   treasure 0.5 -> 0.75, uncommon 75 -> 74.75
#
# Both apply in full on a rod carrying both.
#
# Past the vanilla cap this keeps going rather than levelling off. Once uncommon
# is spent, rare pays, then misc, then epic - so a rod at Luck of the Fish 60 sits
# at rare 63, epic 28, legendary 3.5 and no uncommon at all, and one far past that
# has only legendary and treasure left. Neither of those ever pays, so there is no
# level at which another level stops meaning anything.
enchantments:
  luck-of-the-fish:
    # The plugin's own enchantment, registered at startup and obtainable from an
    # enchanting table like any other. Raises rare, epic and legendary only. Not
    # misc, not treasure - and not mythic, so that no enchantment can make the
    # rarest catch ordinary. Levels I to V, so +50% of base at full.
    bonus-per-level: 10

  luck-of-the-sea:
    # Treasure, and only treasure - that is where the enchanted books are.
    bonus-per-level: 10

  lure:
    # Off by default, so Lure keeps its vanilla job of making fish bite sooner.
    # Set above 0 to have it raise the same tiers as Luck of the Fish; the two
    # multiply rather than one replacing the other.
    bonus-per-level: 0
